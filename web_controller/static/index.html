<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>云平台故障注入工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v=20260506cloud" />
</head>

<body>
  <div class="page">
    <header class="hero">
      <div class="hero-left">
        <div class="badge">Fault Injection Platform</div>
        <h1>云平台故障注入工具</h1>
        <p class="hero-sub">面向 k3s / Chaos Mesh 与虚拟化环境的统一故障注入、恢复和状态观测平台。</p>
      </div>
      <div class="hero-right">
        <div class="pill" id="health">连接中...</div>
        <button class="ghost" id="refreshConfig">刷新配置</button>
      </div>
    </header>

    <section class="panel">
      <div class="panel-head">
        <div>
          <h2>集群概览</h2>
          <p>当前控制器与节点连接信息。</p>
        </div>
        <div class="panel-side">
          <div class="panel-meta" id="outputLimit">输出限制: --</div>
          <div class="overview-status">
            <label class="overview-field">
              <span>命名空间</span>
              <input id="overviewNamespace" type="text" value="default" />
            </label>
            <button class="primary" id="clusterStatus">查看状态</button>
          </div>
        </div>
      </div>
      <div class="nodes" id="nodes"></div>
    </section>

    <section class="panel" id="actionsPanel">
      <div class="panel-head">
        <div>
          <h2>功能面板</h2>
          <p>选择 Pod、网络、资源和虚拟化层故障注入场景，并自动执行前后对比。</p>
        </div>
        <div class="panel-actions">
          <button class="primary" id="recoverAll">一键恢复</button>
        </div>
      </div>
      <div id="actionsContainer" class="action-sections"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <h2>运行历史</h2>
          <p>展示注入与自动测试的完整过程与结果。</p>
        </div>
        <div class="panel-actions">
          <button class="ghost" id="clearHistory">清空记录</button>
        </div>
      </div>
      <div class="history" id="history"></div>
    </section>
  </div>

  <datalist id="nodeList"></datalist>

  <script src="/static/app.js?v=20260506cloud"></script>
</body>

</html>
